services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: job_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["./.runtime/postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["./.runtime/redis:/data"]
  backend:
    build:
      context: ./backend
      args:
        BACKEND_BASE_IMAGE: ${JOB_TRACKER_BACKEND_BASE_IMAGE:-python:3.12-slim}
        SKIP_DEPENDENCY_INSTALL: ${JOB_TRACKER_SKIP_DEPENDENCY_INSTALL:-false}
    environment:
      JOB_TRACKER_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/job_tracker
      JOB_TRACKER_REDIS_URL: redis://redis:6379/0
      JOB_TRACKER_JWT_SECRET_KEY: ${JOB_TRACKER_JWT_SECRET_KEY}
      JOB_TRACKER_KIMI_API_KEY: ${JOB_TRACKER_KIMI_API_KEY:-}
      JOB_TRACKER_KIMI_BASE_URL: ${JOB_TRACKER_KIMI_BASE_URL:-https://api.moonshot.cn/v1}
      JOB_TRACKER_KIMI_MODEL: ${JOB_TRACKER_KIMI_MODEL:-kimi-k2.5}
      JOB_TRACKER_KIMI_WEB_SEARCH_FORMULA: ${JOB_TRACKER_KIMI_WEB_SEARCH_FORMULA:-moonshot/web-search:latest}
      JOB_TRACKER_KIMI_SEARCH_ENABLED: ${JOB_TRACKER_KIMI_SEARCH_ENABLED:-true}
      JOB_TRACKER_KIMI_SEARCH_TIMEOUT_SECONDS: ${JOB_TRACKER_KIMI_SEARCH_TIMEOUT_SECONDS:-8}
      JOB_TRACKER_COMPANY_INTELLIGENCE_CACHE_TTL_SECONDS: ${JOB_TRACKER_COMPANY_INTELLIGENCE_CACHE_TTL_SECONDS:-86400}
      JOB_TRACKER_COMPANY_INTELLIGENCE_RATE_LIMIT_MAX_REQUESTS: ${JOB_TRACKER_COMPANY_INTELLIGENCE_RATE_LIMIT_MAX_REQUESTS:-10}
      JOB_TRACKER_COMPANY_INTELLIGENCE_RATE_LIMIT_WINDOW_SECONDS: ${JOB_TRACKER_COMPANY_INTELLIGENCE_RATE_LIMIT_WINDOW_SECONDS:-60}
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
